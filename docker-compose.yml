services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: bizengine
      POSTGRES_PASSWORD: bizengine
      POSTGRES_DB: bizengine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizengine"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["--jetstream", "--store_dir", "/data"]
    volumes:
      - natsdata:/data

  centrifugo:
    image: centrifugo/centrifugo:v6
    ports:
      - "8001:8001"
    environment:
      CENTRIFUGO_API_KEY: "${CENTRIFUGO_API_KEY:-centrifugo-api-key-change-me}"
      CENTRIFUGO_ADMIN: "true"
      CENTRIFUGO_ADMIN_PASSWORD: "${CENTRIFUGO_ADMIN_PASSWORD:-admin}"
      CENTRIFUGO_ADMIN_SECRET: "${CENTRIFUGO_ADMIN_SECRET:-admin_secret}"
      CENTRIFUGO_ALLOWED_ORIGINS: "*"
    volumes:
      - ./deploy/centrifugo.json:/centrifugo/config.json
    command: centrifugo --config=config.json
    depends_on:
      - redis

volumes:
  pgdata:
  natsdata:
