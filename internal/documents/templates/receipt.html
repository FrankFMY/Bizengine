<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Чек {{.Order.Number}}</title>
<style>
  body { font-family: monospace; font-size: 12px; width: 300px; margin: 0 auto; }
  .center { text-align: center; }
  .line { border-top: 1px dashed #000; margin: 5px 0; }
  table { width: 100%; }
  td { padding: 2px 0; }
  td.right { text-align: right; }
  .total { font-weight: bold; font-size: 14px; }
</style>
</head>
<body>
<div class="center">
  {{if .Org}}<strong>{{.Org.Name}}</strong><br>ИНН {{.Org.INN}}<br>{{end}}
  <div class="line"></div>
  <strong>ЧЕК № {{.Order.Number}}</strong><br>
  {{.Order.Date.Format "02.01.2006 15:04"}}
</div>
<div class="line"></div>
<table>
  {{range .Order.Items}}
  <tr><td>{{.Name}}</td><td class="right">{{.Quantity}} x {{.UnitPrice}}</td></tr>
  <tr><td></td><td class="right">= {{.Total}}</td></tr>
  {{end}}
</table>
<div class="line"></div>
<table>
  <tr class="total"><td>ИТОГО:</td><td class="right">{{kopecksToRubles .Order.Total}} руб.</td></tr>
</table>
<div class="line"></div>
<div class="center"><p>{{.GeneratedAt}}</p><p>СПАСИБО ЗА ПОКУПКУ!</p></div>
</body>
</html>
