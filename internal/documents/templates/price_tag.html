<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Ценники</title>
<style>
  body { font-family: Arial, sans-serif; margin: 10px; }
  .tags { display: flex; flex-wrap: wrap; gap: 10px; }
  .tag { border: 2px solid #000; padding: 10px; width: 200px; text-align: center; }
  .tag .name { font-weight: bold; font-size: 14px; margin-bottom: 5px; }
  .tag .price { font-size: 24px; font-weight: bold; color: #d00; margin: 10px 0; }
  .tag .sku { font-size: 10px; color: #666; }
  .tag .unit { font-size: 11px; }
  .tag .barcode { font-family: monospace; font-size: 10px; margin-top: 5px; }
</style>
</head>
<body>
{{if .Org}}<p style="font-size:10px;">{{.Org.Name}}</p>{{end}}
<div class="tags">
  {{range .Products}}
  <div class="tag">
    <div class="name">{{.Name}}</div>
    <div class="price">{{.Price}} руб.</div>
    <div class="unit">за {{.Unit}}</div>
    <div class="sku">Арт: {{.SKU}}</div>
    {{if .Barcode}}<div class="barcode">{{.Barcode}}</div>{{end}}
    {{if .ValidFrom}}<div class="sku">Действует с {{.ValidFrom}}</div>{{end}}
  </div>
  {{end}}
</div>
<p style="font-size:9px;text-align:right;">Сформировано: {{.GeneratedAt}}</p>
</body>
</html>
