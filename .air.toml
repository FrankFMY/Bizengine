root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/engine"
  cmd = "go build -o ./tmp/engine ./cmd/server"
  delay = 1000
  exclude_dir = ["tmp", "vendor", "migrations", "deploy", "docs", "processes"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go", "yaml"]
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
